name: CI

on:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: make setup
      - run: make lint
      - run: make test
      # Runners use UTC, which would hide bugs that depend on the session time zone.
      - run: make ci
        env:
          TZ: America/Denver
